name: Publish NEW Iran–Iraq War MP4 — direct iPhone playback

on:
  push:
    branches: [documentary/iraq-iran-war-new-film]
    paths: ['.github/workflows/publish-eight-year-front.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout new original-film branch
        uses: actions/checkout@v4
      - name: Install media verification tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Retrieve VERIFIED new MP4 from completed source run
        run: |
          set -euo pipefail
          mkdir -p /tmp/film
          gh run download 40583572688 -n THE-EIGHT-YEAR-FRONT-NEW-1080P-MP4 -D /tmp/film
          find /tmp/film -type f -maxdepth 5
          f="$(find /tmp/film -type f -name 'THE-EIGHT-YEAR-FRONT-1080p.mp4' -print -quit)"
          test -n "$f"
          test -s "$f"
          cp "$f" "./THE-EIGHT-YEAR-FRONT-1080p.mp4"
      - name: Verify direct-playback asset before release
        run: |
          set -euo pipefail
          f=THE-EIGHT-YEAR-FRONT-1080p.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -of json "$f"
          ffmpeg -hide_banner -loglevel error -xerror -i "$f" -f null -
      - name: Publish a direct MP4 download on GitHub Releases
        run: |
          set -euo pipefail
          if gh release view the-eight-year-front-2026-10-27-v1 >/dev/null 2>&1; then
            gh release upload the-eight-year-front-2026-10-27-v1 \
              ./THE-EIGHT-YEAR-FRONT-1080p.mp4 --clobber
            exit 0
          fi
          gh release create the-eight-year-front-2026-10-27-v1 \
            ./THE-EIGHT-YEAR-FRONT-1080p.mp4 \
            --target documentary/iraq-iran-war-new-film \
            --title 'THE EIGHT-YEAR FRONT — Iran–Iraq War (1980–1988) — New 1080p Film' \
            --notes 'New film from original wartime footage, historical photographs, official UN documentary records, and new English synthetic narration. Technical MP4 validation passed. Narration naturalness, pronunciation, complete visual editorial QA, and rights review still require human approval. Unlike the previous V2, no social media interface is used. Credits/source register: see the production branch film/SOURCE-CREDITS.md.' \
            --latest=false
