name: Publish the verified two-thread documentary

on:
  push:
    branches: [documentary/two-thread-evidence-film]
    paths: ['.github/workflows/publish-verified-two-thread-film.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-iraqs-case-two-threads-v1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Asadi123/the-resurrection'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Asadi123/the-resurrection
      SOURCE_SHA: 226c7071a9c305f4985edf84f0de7accb90f294e
      SOURCE_RUN: '40604542887'
      SOURCE_ARTIFACT: '12779604134'
      SOURCE_ARTIFACT_NAME: two-thread-film-validated-40604542887
      SOURCE_ARTIFACT_DIGEST: sha256:5f7266d3e8c697a0efc2cf7debbf60986224ffd191133ef7ea49998b176b841c
      EXPECTED_FILM_SHA: 39f694b82f5b309bbbd59a95a99f527a09d77812256703c071de7e837ec45000
      RELEASE_TAG: iraqs-case-two-threads-v1
      RELEASE_ID: '426120116'
    steps:
      - name: Check out the exact successfully rendered source revision
        uses: actions/checkout@v4
        with:
          ref: 226c7071a9c305f4985edf84f0de7accb90f294e
      - name: Verify the upstream run, immutable artifact and release state
        id: upstream
        run: |
          mkdir -p two_thread/output
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          repo = os.environ['GH_REPO']
          sha = os.environ['SOURCE_SHA']
          run = api(f"repos/{repo}/actions/runs/{os.environ['SOURCE_RUN']}")
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Upstream run did not pass'
          assert run['head_sha'] == sha and run['repository']['full_name'] == repo, 'Upstream provenance differs'
          artifact = api(f"repos/{repo}/actions/artifacts/{os.environ['SOURCE_ARTIFACT']}")
          assert artifact['id'] == int(os.environ['SOURCE_ARTIFACT']), 'Artifact ID differs'
          assert artifact['name'] == os.environ['SOURCE_ARTIFACT_NAME'], 'Artifact name differs'
          assert artifact['digest'] == os.environ['SOURCE_ARTIFACT_DIGEST'], 'Artifact archive digest differs'
          assert artifact['expired'] is False, 'Pinned artifact expired'
          assert artifact['workflow_run']['id'] == int(os.environ['SOURCE_RUN']) and artifact['workflow_run']['head_sha'] == sha, 'Artifact run or revision differs'
          release = api(f"repos/{repo}/releases/{os.environ['RELEASE_ID']}")
          assert release['tag_name'] == os.environ['RELEASE_TAG'] and release['target_commitish'] == sha, 'Release target differs'
          names = {'iraqs-case-1080p.mp4', 'iraqs-case-1080p.render-report.json', 'iraqs-case-1080p.publication.json', 'iraqs-case-1080p.contact-sheet.jpg', 'source-bundle.zip', 'INVENTORY.md'}
          assets = {a['name']: a for a in release['assets']}
          assert set(assets).issubset(names), 'Unexpected existing release assets; refusing to overwrite'
          already = release['draft'] is False
          if already:
              assert set(assets) == names, 'Published release has incomplete assets'
              assert assets['iraqs-case-1080p.mp4'].get('digest') == 'sha256:' + os.environ['EXPECTED_FILM_SHA'], 'Published master differs; refusing changes'
              assert all(a.get('state') == 'uploaded' for a in assets.values()), 'Published assets are incomplete'
              Path('two_thread/output/confirmed-release.json').write_text(json.dumps(release, indent=2) + '\n')
          else:
              assert release['draft'] is True, 'Release is neither an approved draft nor a matching publication'
          Path('two_thread/output/upstream-verification.json').write_text(json.dumps({'run_id': run['id'], 'head_sha': sha, 'run_conclusion': run['conclusion'], 'artifact_id': artifact['id'], 'artifact_digest': artifact['digest'], 'release_id': release['id'], 'already_published': already}, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f"already_published={str(already).lower()}\n")
          PY
      - name: Set up Python
        if: steps.upstream.outputs.already_published != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: two_thread/requirements.txt
      - name: Install independent MP4 validation tools
        if: steps.upstream.outputs.already_published != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r two_thread/requirements.txt
      - name: Download the pinned successful run artifact
        if: steps.upstream.outputs.already_published != 'true'
        uses: actions/download-artifact@v4
        with:
          name: two-thread-film-validated-40604542887
          run-id: 40604542887
          repository: Asadi123/the-resurrection
          github-token: ${{ github.token }}
          path: two_thread
      - name: Revalidate source provenance, full edit and complete MP4 decode
        if: steps.upstream.outputs.already_published != 'true'
        run: |
          python -m two_thread.publish --check-only --film two_thread/output/iraqs-case-1080p.mp4 --bundle two_thread/output/source-bundle.zip
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          film = Path('two_thread/output/iraqs-case-1080p.mp4')
          with film.open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          assert actual == os.environ['EXPECTED_FILM_SHA'], 'Master differs from both successful CI renders'
          report = json.loads(film.with_suffix('.render-report.json').read_text())
          receipt = json.loads(film.with_suffix('.publication.json').read_text())
          assert report['status'] == 'RENDERED_VALIDATED' and receipt['status'] == 'PUBLISHABLE'
          assert receipt['full_decode_validation'] == 'PASS' and receipt['source_assets_verified'] == 98
          assert receipt['source_assets_used'] == 97 and receipt['segments_verified'] == 98
          files = [film, film.with_suffix('.render-report.json'), film.with_suffix('.publication.json'), film.with_suffix('.contact-sheet.jpg'), Path('two_thread/output/source-bundle.zip'), Path('two_thread/INVENTORY.md')]
          hashes = {}
          for path in files:
              assert path.is_file(), f'Missing release input: {path}'
              with path.open('rb') as stream:
                  hashes[path.name] = {'sha256': hashlib.file_digest(stream, 'sha256').hexdigest(), 'bytes': path.stat().st_size}
          Path('two_thread/output/release-input-hashes.json').write_text(json.dumps(hashes, indent=2) + '\n')
          notes = f'''# Iraq's Case — the two-thread record

          This documentary adopts an explicitly Iraqi Ba’athist editorial perspective. Its confrontational argument is attributed to that perspective; source assertions, translations and archival identifications are not independent authentication.

          The complete source collection contains 72 posts and 98 attachment associations from only:
          - https://threadreaderapp.com/thread/1668916665550094339.html
          - https://threadreaderapp.com/thread/1986782578565579207.html

          The full 1920×1080, 30 fps film lasts {report['duration_seconds']} seconds and uses 97 selected source attachment identities across 98 edit segments. One POW recording is deliberately omitted and documented in the edit. All 98 acquired attachments remain in the source bundle. Every displayed image is contained without cropping; some source images were already excerpts and unseen original pages are not reconstructed. Original recording audio is retained; no synthetic narrator, battlefield imagery or unrelated music is added. Prior films' historical material is not reused.

          Both successful source-revision CI runs passed 163 pytest tests (including the unittest cases), actual 72-post/98-attachment retrieval, full rendering and independent full-decode publication validation:
          - https://github.com/Asadi123/the-resurrection/actions/runs/40604536218
          - https://github.com/Asadi123/the-resurrection/actions/runs/40604542887

          Source revision: `{os.environ['SOURCE_SHA']}`
          Film SHA256: `{actual}`

          The supplied archival reproductions and highlighted passages have the limitations documented in the inventory and edit; completeness of an attachment collection is not proof of its historical claims. Public availability does not establish blanket reproduction rights. This release makes no blanket rights-clearance claim. The source bundle includes provenance, hashes, editorial notes and the reusable production code.
          '''
          Path('two_thread/output/release-notes.md').write_text(notes, encoding='utf-8')
          PY
      - name: Confirm the exact release is still a draft before uploading
        if: steps.upstream.outputs.already_published != 'true'
        run: |
          python - <<'PY'
          import json, os, subprocess
          release = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GH_REPO']}/releases/{os.environ['RELEASE_ID']}"], text=True))
          assert release['draft'] is True and release['target_commitish'] == os.environ['SOURCE_SHA'] and release['tag_name'] == os.environ['RELEASE_TAG'], 'Release changed; refusing uploads'
          PY
      - name: Upload only the six independently verified release inputs
        if: steps.upstream.outputs.already_published != 'true'
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            two_thread/output/iraqs-case-1080p.mp4 \
            two_thread/output/iraqs-case-1080p.render-report.json \
            two_thread/output/iraqs-case-1080p.publication.json \
            two_thread/output/iraqs-case-1080p.contact-sheet.jpg \
            two_thread/output/source-bundle.zip \
            two_thread/INVENTORY.md
      - name: Verify every server-side asset hash before publication
        if: steps.upstream.outputs.already_published != 'true'
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          release = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GH_REPO']}/releases/{os.environ['RELEASE_ID']}"], text=True))
          assert release['draft'] is True and release['target_commitish'] == os.environ['SOURCE_SHA'] and release['tag_name'] == os.environ['RELEASE_TAG'], 'Draft changed during upload'
          expected = json.loads(Path('two_thread/output/release-input-hashes.json').read_text())
          assets = {a['name']: a for a in release['assets']}
          assert set(assets) == set(expected), 'Uploaded release asset set differs'
          for name, local in expected.items():
              actual = assets[name]
              assert actual['state'] == 'uploaded' and actual['size'] == local['bytes'], f'Incomplete upload: {name}'
              assert actual.get('digest') == 'sha256:' + local['sha256'], f'Server-side hash mismatch: {name}'
          Path('two_thread/output/server-verified-draft.json').write_text(json.dumps(release, indent=2) + '\n')
          PY
      - name: Publish the verified draft without replacing the latest release
        if: steps.upstream.outputs.already_published != 'true'
        run: gh release edit "$RELEASE_TAG" --draft=false --latest=false --notes-file two_thread/output/release-notes.md
      - name: Confirm publication and direct asset URLs
        id: confirm
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          release = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GH_REPO']}/releases/{os.environ['RELEASE_ID']}"], text=True))
          assert release['draft'] is False and release['target_commitish'] == os.environ['SOURCE_SHA'] and release['tag_name'] == os.environ['RELEASE_TAG'], 'Publication not confirmed'
          assets = {a['name']: a for a in release['assets']}
          names = {'iraqs-case-1080p.mp4', 'iraqs-case-1080p.render-report.json', 'iraqs-case-1080p.publication.json', 'iraqs-case-1080p.contact-sheet.jpg', 'source-bundle.zip', 'INVENTORY.md'}
          assert set(assets) == names and all(a['state'] == 'uploaded' for a in assets.values()), 'Published release is incomplete'
          assert assets['iraqs-case-1080p.mp4'].get('digest') == 'sha256:' + os.environ['EXPECTED_FILM_SHA'], 'Published film differs'
          hashes = Path('two_thread/output/release-input-hashes.json')
          if hashes.exists():
              for name, local in json.loads(hashes.read_text()).items():
                  assert assets[name].get('digest') == 'sha256:' + local['sha256'], f'Published asset differs: {name}'
          prefix = f"https://github.com/{os.environ['GH_REPO']}/releases/download/{os.environ['RELEASE_TAG']}/"
          assert all(a['browser_download_url'] == prefix + a['name'] for a in assets.values()), 'Unexpected direct download URL'
          Path('two_thread/output/confirmed-release.json').write_text(json.dumps(release, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('published=true\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('## Published after independent source and MP4 validation\n\n')
              stream.write(f"[GitHub Release]({release['html_url']})\n\n")
              stream.write(f"[Download the 1080p MP4]({assets['iraqs-case-1080p.mp4']['browser_download_url']})\n\n")
              stream.write(f"[Download the complete source bundle]({assets['source-bundle.zip']['browser_download_url']})\n\n")
              stream.write(f"Film SHA256: `{os.environ['EXPECTED_FILM_SHA']}`\n")
          PY
      - name: Preserve publication and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-thread-publication-diagnostics-${{ github.run_id }}
          path: |
            two_thread/output/*verification.json
            two_thread/output/*publication.json
            two_thread/output/release-input-hashes.json
            two_thread/output/server-verified-draft.json
            two_thread/output/confirmed-release.json
            two_thread/output/release-notes.md
            two_thread/output/*.render-report.json
          if-no-files-found: warn
          retention-days: 30
