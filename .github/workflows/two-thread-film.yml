name: Two-thread documentary — acquire, test and render

on:
  push:
    branches:
      - documentary/two-thread-evidence-film
    paths:
      - 'two_thread/**'
      - 'tests/test_two_thread*'
      - '.github/workflows/two-thread-film.yml'
  pull_request:
    branches: [main]
    paths:
      - 'two_thread/**'
      - 'tests/test_two_thread*'
      - '.github/workflows/two-thread-film.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated full film and exclusive-source bundle as a GitHub Release
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: two-thread-film-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Verify exclusive sources and render full 1080p film
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      validated: ${{ steps.validate.outputs.validated }}
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out this exact revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: two_thread/requirements.txt
      - name: Install rendering and test dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r two_thread/requirements.txt pytest
      - name: Run all unittest cases and the complete pytest suite
        run: |
          python -m unittest discover -s tests -v
          python -m pytest -q
      - name: Acquire both actual source collections and every primary attachment
        timeout-minutes: 25
        run: |
          mkdir -p two_thread/output
          set -o pipefail
          python -m two_thread.acquire 2>&1 | tee two_thread/output/acquisition.log
      - name: Render the complete exclusive-source film
        timeout-minutes: 50
        run: |
          set -o pipefail
          python -m two_thread.render --output two_thread/output/iraqs-case-1080p.mp4 --workdir two_thread/output/render 2>&1 | tee two_thread/output/render.log
      - name: Independently validate film, source hashes and approved edit
        id: validate
        timeout-minutes: 15
        run: |
          python -m two_thread.publish --check-only --film two_thread/output/iraqs-case-1080p.mp4 --bundle two_thread/output/source-bundle.zip
          printf 'validated=true\n' >> "$GITHUB_OUTPUT"
      - name: Upload the validated film and reproducible source collection
        if: steps.validate.outputs.validated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: two-thread-film-validated-${{ github.run_id }}
          path: |
            two_thread/output/iraqs-case-1080p.mp4
            two_thread/output/iraqs-case-1080p.render-report.json
            two_thread/output/iraqs-case-1080p.contact-sheet.jpg
            two_thread/output/source-bundle.zip
            two_thread/collection.json
            two_thread/edit.json
            two_thread/INVENTORY.md
            two_thread/MISSING-ASSETS.md
            two_thread/evidence/
            two_thread/assets/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Preserve acquisition diagnostics even when the source is unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-thread-source-diagnostics-${{ github.run_id }}
          path: |
            two_thread/collection.json
            two_thread/edit.json
            two_thread/INVENTORY.md
            two_thread/MISSING-ASSETS.md
            two_thread/evidence/
            two_thread/output/*.log
            two_thread/output/*.json
            two_thread/output/*.jpg
          if-no-files-found: warn
          retention-days: 30
      - name: Explain the production status
        if: always()
        env:
          VALIDATED: ${{ steps.validate.outputs.validated }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          passed = os.environ.get('VALIDATED') == 'true'
          text = ('## Two-thread documentary production\n\n'
                  + ('Full film passed independent source, edit and MP4 validation. Download the validated artifact.\n'
                     if passed else 'The full film is not validated. Inspect source diagnostics; no release is permitted.\n')
                  + '\nThe two specified threads are the only historical sources. Their assertions and attached translations are not independent historical authentication.\n'
                  + '\nA GitHub Release is created only for a manual run with `publish` enabled, after validation in both jobs.\n')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as stream:
              stream.write(text)
          PY

  release:
    name: Publish only the independently validated full film
    needs: render
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && needs.render.outputs.validated == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the exact validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: two_thread/requirements.txt
      - name: Install independent validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r two_thread/requirements.txt
      - name: Restore this run's validated artifacts and original source assets
        uses: actions/download-artifact@v4
        with:
          name: two-thread-film-validated-${{ github.run_id }}
          path: two_thread
      - name: Revalidate the downloaded film and all retained source bytes
        run: python -m two_thread.publish --check-only --film two_thread/output/iraqs-case-1080p.mp4
      - name: Publish a direct MP4 download and the source bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: two-thread-${{ github.run_id }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$TARGET_SHA" \
            --title "Iraq's Case — exclusive-source documentary" \
            --notes "1080p film validated against the approved edit and the exact two commissioned Thread Reader collections. Original recordings and complete supplied images only. The attached threads' assertions, translations and archival identifications have not been independently authenticated. The source bundle contains the attachment inventory, recorded hashes and original source material. This release does not replace or reuse the previous films' historical content." \
            --latest=false \
            two_thread/output/iraqs-case-1080p.mp4 \
            two_thread/output/iraqs-case-1080p.render-report.json \
            two_thread/output/iraqs-case-1080p.contact-sheet.jpg \
            two_thread/output/source-bundle.zip
